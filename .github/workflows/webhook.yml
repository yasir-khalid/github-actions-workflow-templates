name: Webhook triggered workflow

on:
  repository_dispatch:
    types: [webhook]

jobs:
  read-webhook-payload:
    name: "Read Webhook payload (Stage 2)"
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 1 (check payload)"
        run: echo "Stage 1"
      - name: "Print webhook message"
        env:
          MESSAGE: ${{ github.event.client_payload.author }}
        run: echo "$MESSAGE"
  stage2-after-webhook:
    name: "Stage 2"
    needs: read-webhook-payload
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 2"
        run: echo "placeholder"
  send-slack-notification:
    name: "Send Slack Notification"
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 2"
        run: echo "placeholder"