name: Build and Release a Next.js app
on: [workflow_dispatch, push]

jobs:
    build-project:
        name: build next.js project
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Install npm dependencies
              run: make install
            - name: Build Next.js project
              run: make run
            - name: Upload build artifacts to registry
              uses: actions/upload-artifact@v4
              with:
                name: code-drop
                path: .next/